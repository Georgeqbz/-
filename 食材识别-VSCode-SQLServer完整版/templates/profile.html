{% extends "base.html" %}{% set active="profile" %}
{% block title %}个人中心 - 智能食检{% endblock %}
{% block content %}
<header class="profile-hero"><div class="avatar-tech"><i class="fa-solid fa-user-astronaut"></i></div><div><div class="eyebrow"><span class="status-dot"></span> PERSONAL NUTRITION ID</div><h1 id="profileName">我的健康档案</h1><p>管理你的食谱收藏与 AI 识别记录</p></div></header>
<div class="profile-tabs"><button class="active" data-tab="favorites"><i class="fa-regular fa-heart"></i> 食谱收藏</button><button data-tab="history"><i class="fa-solid fa-clock-rotate-left"></i> 识别历史</button><button data-tab="health"><i class="fa-solid fa-heart-pulse"></i> 健康目标</button></div>
<section id="favorites" class="profile-view"><div class="section-heading"><div><span>MY COLLECTION</span><h2>收藏食谱</h2></div></div><div id="favGrid" class="recipe-grid-new"></div><div id="favPagination" class="tech-pagination hidden"></div></section>
<section id="history" class="profile-view hidden"><div class="section-heading"><div><span>SCAN LOG</span><h2>识别记录</h2></div><button class="danger-ghost" onclick="clearHistory()">清空记录</button></div><div id="historyList" class="history-timeline"></div><div id="historyPagination" class="tech-pagination hidden"></div></section>
<section id="health" class="profile-view hidden">
  <div class="section-heading"><div><span>HEALTH TARGET ENGINE</span><h2>个人健康目标</h2></div></div>
  <div class="health-layout">
    <form id="healthForm" class="health-form">
      <label>性别<select id="gender"><option value="male">男</option><option value="female">女</option></select></label>
      <label>年龄<input id="age" type="number" min="12" max="100" value="25"></label>
      <label>身高（cm）<input id="heightCm" type="number" min="100" max="230" step="0.1" value="170"></label>
      <label>体重（kg）<input id="weightKg" type="number" min="30" max="300" step="0.1" value="65"></label>
      <label>活动水平<select id="activityLevel"><option value="1.2">久坐</option><option value="1.375" selected>轻度运动</option><option value="1.55">中度运动</option><option value="1.725">高强度运动</option></select></label>
      <label>当前目标<select id="healthGoal"><option value="lose">减脂</option><option value="maintain" selected>保持体重</option><option value="gain">增肌</option></select></label>
      <button class="neon-btn" type="submit"><i class="fa-solid fa-calculator"></i> 计算并保存</button>
    </form>
    <div id="healthMetrics" class="health-metrics"><div class="empty-tech">填写档案后生成个性化指标</div></div>
  </div>
</section>
<dialog id="profileRecipeDialog" class="recipe-dialog"><button class="dialog-close" onclick="document.getElementById('profileRecipeDialog').close()">×</button><div id="profileDialogBody"></div></dialog>
{% endblock %}
{% block scripts %}
<script>
document.querySelectorAll('.profile-tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.profile-tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.profile-view').forEach(x=>x.classList.add('hidden'));document.getElementById(b.dataset.tab).classList.remove('hidden');if(b.dataset.tab==='favorites')loadFav();if(b.dataset.tab==='history')loadHistory();if(b.dataset.tab==='health')loadHealth()});
let currentFavorites=[],favPage=1,favTotalPages=1,historyPage=1,historyTotalPages=1;
function pagination(id,page,total,loader){const el=document.getElementById(id);if(total<=1){el.classList.add('hidden');el.innerHTML='';return}el.classList.remove('hidden');let nums='';for(let i=1;i<=total;i++){if(i===1||i===total||Math.abs(i-page)<=1)nums+=`<button class="${i===page?'active':''}" onclick="${loader}(${i})">${i}</button>`;else if(!nums.endsWith('<span>…</span>'))nums+='<span>…</span>'}el.innerHTML=`<button ${page===1?'disabled':''} onclick="${loader}(${page-1})"><i class="fa-solid fa-chevron-left"></i></button>${nums}<button ${page===total?'disabled':''} onclick="${loader}(${page+1})"><i class="fa-solid fa-chevron-right"></i></button>`}
async function loadFav(page=1){const box=document.getElementById('favGrid');box.innerHTML='<div class="skeleton-card"></div><div class="skeleton-card"></div>';const d=await fetch('/api/favorite/list?page='+page).then(r=>r.json());if(!d.success){box.innerHTML='<div class="empty-tech large"><i class="fa-solid fa-lock"></i><h3>请先登录</h3><a class="neon-btn" href="/login">去登录</a></div>';return}currentFavorites=d.favorites;favPage=d.page;favTotalPages=d.total_pages;box.innerHTML=d.favorites.map((x,i)=>`<article class="recipe-tile mini"><div class="recipe-cover" onclick="showFavDetail(${i})"><span>🥗</span><em>${escapeHtml(x.cuisine)}</em></div><div class="recipe-body"><small>${escapeHtml(x.feature)}</small><h3 onclick="showFavDetail(${i})">${escapeHtml(x.name)}</h3><p><i class="fa-solid fa-fire"></i> ${x.calories||0} kcal</p><div><button class="ghost-btn" onclick="showFavDetail(${i})">查看详情</button><button class="danger-ghost" onclick="removeFav(${x.recipe_id},'${x.recipe_type}')">取消收藏</button></div></div></article>`).join('')||'<div class="empty-tech">暂时没有收藏的食谱</div>';pagination('favPagination',d.page,d.total_pages,'loadFav')}
function showFavDetail(i){const x=currentFavorites[i];document.getElementById('profileDialogBody').innerHTML=`<div class="dialog-hero"><span>MY FAVORITE · ${escapeHtml(x.cuisine||'健康食谱')}</span><h2>${escapeHtml(x.name)}</h2><p>${x.calories||'--'} kcal / 份</p></div><div class="dialog-section"><h3>所需食材</h3><p>${escapeHtml(x.ingredients||'暂无')}</p><h3>制作步骤</h3><p>${escapeHtml(x.steps||'暂无')}</p><h3>健康提示</h3><p>${escapeHtml(x.tips||'少油少盐，合理搭配。')}</p></div>`;document.getElementById('profileRecipeDialog').showModal()}
async function removeFav(id,type){const d=await fetch('/api/favorite/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({recipe_id:id,recipe_type:type})}).then(r=>r.json());toast(d.message);loadFav(favPage)}
async function loadHistory(page=1){const box=document.getElementById('historyList');box.innerHTML='<div class="loading-tech">加载记录中...</div>';const d=await fetch('/api/history/list?page='+page).then(r=>r.json());if(!d.success){box.innerHTML='<div class="empty-tech">请先登录查看历史</div>';return}historyPage=d.page;historyTotalPages=d.total_pages;box.innerHTML=d.history.map(x=>`<article class="history-row"><div class="timeline-dot"><i class="fa-solid fa-leaf"></i></div><div><small>${escapeHtml(x.created_at)}</small><h3>${escapeHtml(x.food_name)}</h3><p>识别为 ${escapeHtml(x.recognized_as)} · ${escapeHtml(x.calorie_per_100g)}</p></div><button class="icon-btn" onclick="deleteHistory(${x.id})"><i class="fa-regular fa-trash-can"></i></button></article>`).join('')||'<div class="empty-tech">暂时没有识别记录</div>';pagination('historyPagination',d.page,d.total_pages,'loadHistory')}
async function deleteHistory(id){await fetch('/api/history/delete/'+id,{method:'DELETE'});loadHistory(historyPage)}async function clearHistory(){if(confirm('确定清空全部识别记录吗？')){await fetch('/api/history/clear',{method:'POST'});loadHistory(1)}}
fetch('/api/check_login').then(r=>r.json()).then(d=>{if(d.logged_in)document.getElementById('profileName').textContent=d.username+' 的健康档案'});loadFav(1);
const field=id=>document.getElementById(id);
async function loadHealth(){const d=await fetch('/api/profile/health').then(r=>r.json());if(!d.success)return field('healthMetrics').innerHTML='<div class="empty-tech">请先登录</div>';if(d.has_profile){const p=d.profile;field('gender').value=p.gender;field('age').value=p.age;field('heightCm').value=p.height_cm;field('weightKg').value=p.weight_kg;field('activityLevel').value=p.activity_level;field('healthGoal').value=p.goal;renderMetrics(d.metrics)}}
function renderMetrics(m){field('healthMetrics').innerHTML=`<div class="health-score"><small>BODY MASS INDEX</small><b>${m.bmi}</b><span>${m.bmi_label}</span></div><div class="health-result"><div><small>基础代谢 BMR</small><b>${m.bmr} kcal</b></div><div><small>每日目标热量</small><b>${m.daily_target} kcal</b></div></div><p><i class="fa-solid fa-circle-info"></i> 该结果用于日常健康管理参考，不替代专业医疗建议。</p>`}
document.getElementById('healthForm').onsubmit=async e=>{e.preventDefault();const payload={gender:field('gender').value,age:field('age').value,height_cm:field('heightCm').value,weight_kg:field('weightKg').value,activity_level:field('activityLevel').value,goal:field('healthGoal').value};const d=await fetch('/api/profile/health',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(r=>r.json());toast(d.message||'健康目标已保存');if(d.success&&d.metrics)renderMetrics(d.metrics)};
</script>
{% endblock %}
