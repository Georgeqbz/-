{% extends "base.html" %}{% set active="analysis" %}
{% block title %}营养分析 - 智能食检{% endblock %}
{% block head %}<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>{% endblock %}
{% block content %}
<header class="page-hero compact"><div><div class="eyebrow"><span class="status-dot"></span> HEALTH DATA CENTER</div><h1>个人营养数据舱</h1><p>把每次识别连接成清晰、可行动的健康趋势。</p></div><button class="neon-btn" onclick="loadData()"><i class="fa-solid fa-rotate"></i> 刷新数据</button></header>
<div id="analysisRoot"><div class="loading-tech"><i class="fa-solid fa-circle-notch fa-spin"></i> 正在同步营养档案...</div></div>
{% endblock %}
{% block scripts %}
<script>
async function loadData(){const root=document.getElementById('analysisRoot');try{const d=await fetch('/api/diet/overview').then(r=>r.json());if(!d.has_data){root.innerHTML=`<div class="empty-tech large"><i class="fa-solid fa-chart-simple"></i><h3>还没有可分析的数据</h3><p>${escapeHtml(d.message||'先去识别一种食材吧')}</p><a class="neon-btn" href="/">开始识别</a></div>`;return}root.innerHTML=`<section class="metric-grid big">${m('今日累计热量',d.total_calories+' kcal','fa-fire','orange')}${m('蛋白质',d.total_protein+' g','fa-dumbbell','green')}${m('脂肪',d.total_fat+' g','fa-droplet','yellow')}${m('碳水',d.total_carb+' g','fa-wheat-awn','blue')}</section><section class="chart-layout"><div class="data-panel"><div class="panel-head"><span>七日热量趋势</span><em>LIVE DATA</em></div><div id="trendChart" class="chart"></div></div><div class="data-panel"><div class="panel-head"><span>高频食材</span><em>TOP 5</em></div><div id="foodChart" class="chart"></div></div></section><section class="suggestion-panel"><i class="fa-solid fa-brain"></i><div><small>AI HEALTH INSIGHT</small><h3>今日健康建议</h3>${d.suggestions.map(s=>`<p><span class="status-dot"></span>${escapeHtml(s)}</p>`).join('')}</div></section>`;draw(d)}catch(e){root.innerHTML='<div class="empty-tech">数据加载失败，请确认已登录</div>'}}
function m(n,v,i,c){return `<div class="metric ${c}"><i class="fa-solid ${i}"></i><div><small>${n}</small><b>${v}</b></div></div>`}
async function draw(d){const trend=await fetch('/api/diet/trend').then(r=>r.json());const axis={axisLabel:{color:'#80aa9a'},axisLine:{lineStyle:{color:'rgba(91,255,175,.20)'}},axisTick:{show:false}};const base={textStyle:{fontFamily:'Microsoft YaHei UI',color:'#bce2d3'},grid:{left:42,right:20,top:30,bottom:35},tooltip:{trigger:'axis',backgroundColor:'#06251b',borderColor:'rgba(91,255,175,.35)',textStyle:{color:'#dcfff0'}}};echarts.init(document.getElementById('trendChart')).setOption({...base,xAxis:{...axis,type:'category',data:trend.map(x=>x.date)},yAxis:{...axis,type:'value',splitLine:{lineStyle:{color:'rgba(91,255,175,.08)'}}},series:[{type:'line',smooth:true,data:trend.map(x=>x.calories),symbolSize:9,lineStyle:{color:'#55f5a7',width:3,shadowColor:'rgba(85,245,167,.45)',shadowBlur:12},itemStyle:{color:'#9affc8',borderColor:'#063f2d',borderWidth:3},areaStyle:{color:'rgba(0,201,123,.13)'}}]});echarts.init(document.getElementById('foodChart')).setOption({...base,xAxis:{...axis,type:'category',data:d.top_foods.map(x=>x.name)},yAxis:{...axis,type:'value',splitLine:{lineStyle:{color:'rgba(91,255,175,.08)'}}},series:[{type:'bar',data:d.top_foods.map(x=>x.count),barWidth:24,itemStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'#7affba'},{offset:1,color:'#08784f'}]},shadowColor:'rgba(85,245,167,.28)',shadowBlur:10,borderRadius:[7,7,0,0]}}]})}
loadData();
</script>
{% endblock %}
